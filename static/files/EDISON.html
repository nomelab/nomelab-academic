<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EDISON Workshop Spreadsheet</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      border: 1px solid #d8dee9;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      padding: 36px;
      max-width: 620px;
      width: 90%;
      text-align: center;
    }
    h1 {
      margin-top: 0;
      color: #0f3b5f;
      font-size: 1.8rem;
    }
    p {
      font-size: 1.05rem;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    a.button {
      display: inline-block;
      background: #0f6b8f;
      color: white;
      text-decoration: none;
      font-weight: bold;
      padding: 14px 24px;
      border-radius: 10px;
      font-size: 1.05rem;
    }
    a.button:hover {
      background: #0b526d;
    }
    .url {
      margin-top: 24px;
      font-size: 0.85rem;
      color: #4b5563;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>EDISON Workshop Spreadsheet</h1>
    <p>Use the button below to open the shared Google Sheets version of the EDISON workshop agenda and asset co-design matrix.</p>
    <a class="button" href="https://docs.google.com/spreadsheets/d/1nhwowp7QbyQk6R_FUE_X3xAMo0nhmxEwZepdz6Bhsro/edit?usp=sharing" target="_blank" rel="noopener noreferrer">Open Google Sheet</a>
    <div class="url">https://docs.google.com/spreadsheets/d/1nhwowp7QbyQk6R_FUE_X3xAMo0nhmxEwZepdz6Bhsro/edit?usp=sharing</div>
  </main>
</body>
</html>
