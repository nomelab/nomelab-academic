        if (name === 'file-text') return <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>;
        if (name === 'bar-chart') return <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>;
        return null;

    // --- Toggle Switch Component (Moved Outside App to Fix ReferenceError) ---
    const Toggle = ({ value, onChange, options }) => (
        <div className="toggle-switch" onClick={() => onChange(value === options[0].val ? options[1].val : options[0].val)}>
            {options.map(opt => (
                <div key={opt.val} className={`toggle-option ${value === opt.val ? 'toggle-active' : 'toggle-inactive'}`}>
                    {opt.label}
                </div>
            ))}
        </div>
    );

    // --- Core Calculation Logic ---
    const performCalculation = (accelName, accelConfig, cathodesList, numExperiments, forcedHoursPerExp = null) => {
        if (!accelConfig.enabled) return { irrTime: 0, setupTime: 0, sourceChanges: 0, sourceTime: 0, total: 0, effectiveFlux: 0 };

        const cathode = cathodesList.find(c => c.id === parseInt(accelConfig.cathodeId));
        const sourceLife = cathode ? cathode.life : Infinity;
        const standardRate = cathode ? (cathode.defaultRate || DEFAULT_GLOBAL_RATE) : DEFAULT_GLOBAL_RATE;

        // Parse inputs carefully
        const targetDose = parseFloat(accelConfig.targetDose) || 0;
        const targetFluence = parseFloat(accelConfig.targetFluence) || 0;
        const doseRate = parseFloat(accelConfig.doseRate) || 0;
        const fluxInput = parseFloat(accelConfig.flux) || 0;
        // Interpret flux units consistently with the fluence unit toggle (cm² vs m²)
        const flux = (accelConfig.fluenceUnit === 'm2') ? (fluxInput / 10000) : fluxInput;
        const current = parseFloat(accelConfig.current) || 0;
        const area = parseFloat(accelConfig.area) || 1; 
        const charge = parseFloat(accelConfig.charge) || 1;
        const srimFactor = parseFloat(accelConfig.srimFactor) || 0;

        let irrHoursPerExp = 0;
        let effectiveFlux = 0; // For display purposes

        if (forcedHoursPerExp !== null) {
            // Override Logic: Used when Wolverine dictates the schedule
            irrHoursPerExp = forcedHoursPerExp;
        } else {
            let irrSeconds = 0;
            
            // Normalize Fluence Target based on Unit
            let targetFluenceCm2 = targetFluence;
            if (accelConfig.targetType === 'fluence' && accelConfig.fluenceUnit === 'm2') {
                targetFluenceCm2 = targetFluence / 10000;
            } 

            // --- Logic Branch A: Target is Dose (dpa) ---
            if (accelConfig.targetType === 'dose') {
                if (accelConfig.rateType === 'std_rate') {
                    irrSeconds = targetDose / standardRate;
                } else if (accelConfig.rateType === 'custom_rate') {
                    if (doseRate > 0) irrSeconds = targetDose / doseRate;
                } else if (accelConfig.rateType === 'current') {
                    const amps = current * 1e-6;
                    const areaCm2 = area / 100;
                    const q = charge * ELEMENTARY_CHARGE;
                    const calcFlux = amps / (q * areaCm2);
                    effectiveFlux = calcFlux;
                    const dpaPerSecond = calcFlux * srimFactor;
                    
                    if (dpaPerSecond > 0) {
                        irrSeconds = targetDose / dpaPerSecond;
                    } else {
                        irrSeconds = 0; 
                    }
                } else if (accelConfig.rateType === 'flux') {
                    effectiveFlux = flux;
                    const dpaPerSecond = flux * srimFactor;
                    if (dpaPerSecond > 0) irrSeconds = targetDose / dpaPerSecond;
                }
            }
            
            // --- Logic Branch B: Target is Fluence ---
            if (accelConfig.targetType === 'fluence') {
                if (accelConfig.rateType === 'flux') {
                    // flux is already normalized to ions/cm²/s above
                    effectiveFlux = flux;
                    if (flux > 0) irrSeconds = targetFluenceCm2 / flux;

                } else if (accelConfig.rateType === 'current') {
                    const amps = current * 1e-6;
                    const areaCm2 = area / 100;
                    const q = charge * ELEMENTARY_CHARGE;
                    const calcFlux = amps / (q * areaCm2); // ions/cm²/s
                    effectiveFlux = calcFlux;
                    if (calcFlux > 0) irrSeconds = targetFluenceCm2 / calcFlux;

                } else if (accelConfig.rateType === 'std_rate' || accelConfig.rateType === 'custom_rate') {
                    // Convert target fluence -> equivalent dose using SRIM factor (dpa per ion fluence)
                    // srimFactor units: dpa per (ion/cm²)  == dpa·cm²/ion
                    if (srimFactor > 0) {
                        const equivDose = targetFluenceCm2 * srimFactor; // dpa
                        const dpaRate = (accelConfig.rateType === 'std_rate') ? standardRate : doseRate; // dpa/s
                        if (dpaRate > 0) {
                            irrSeconds = equivDose / dpaRate;
                            // For user feedback: show the implied flux that would achieve the chosen dose rate
                            effectiveFlux = dpaRate / srimFactor; // ions/cm²/s
                        }
                    }
                }
            }

            irrHoursPerExp = irrSeconds / 3600;
        }

        const totalIrrHours = irrHoursPerExp * numExperiments;
        const totalSetup = numExperiments * SETUP_HOURS_PER_ACCEL;

        let changes = 0;
        if (sourceLife !== Infinity && sourceLife > 0) {
            changes = Math.floor((totalIrrHours - 0.001) / sourceLife);
        }
        
        const sourceTime = changes * SOURCE_CHANGE_PENALTY;

        return {
            irrTime: totalIrrHours,
            setupTime: totalSetup,
            sourceChanges: changes,
            sourceTime: sourceTime,
            total: (totalIrrHours + totalSetup + sourceTime),
            effectiveFlux: effectiveFlux
        };
    };

    // --- Helper to format beam time dynamically ---
    const formatBeamTime = (hours) => {
        if (!hours) return "0.00 h";
        if (hours < 0.0001) return "< 1 s";
        if (hours < 0.01) {
            const secs = hours * 3600;
            return `${secs.toFixed(1)} s`;
        }
        if (hours < 1) {
            const mins = hours * 60;
            return `${mins.toFixed(1)} min`;
        }
        return `${hours.toFixed(2)} h`;
    };

    function App() {
        const [activeTab, setActiveTab] = useState('calculator');

        const [quoteQueue, setQuoteQueue] = useState([]);

        const [cathodes, setCathodes] = useState(INITIAL_CATHODES);
        const [rates, setRates] = useState(RATE_PRESETS.internal);
        const [rateType, setRateType] = useState('internal');

        // --- State: Inputs ---
        const [accelData, setAccelData] = useState({
            'Blue': { enabled: false, cathodeId: 1, mode: 'dose_rate', targetType: 'dose', targetDose: 10, targetFluence: 1e16, fluenceUnit: 'cm2', rateType: 'std_rate', doseRate: 1e-4, flux: 1e12, current: 10, charge: 1, area: 100, srimFactor: 1 },
            'Maize': { enabled: true, cathodeId: 3, mode: 'dose_rate', targetType: 'dose', targetDose: 50, targetFluence: 5e16, fluenceUnit: 'cm2', rateType: 'std_rate', doseRate: 2e-3, flux: 1e13, current: 5, charge: 3, area: 25, srimFactor: 1 },
            'Wolverine': { enabled: false, cathodeId: 1, mode: 'dose_rate', targetType: 'dose', targetDose: 50, targetFluence: 5e16, fluenceUnit: 'cm2', rateType: 'std_rate', doseRate: 1e-4, flux: 1e12, current: 20, charge: 1, area: 100, srimFactor: 1 },
        });

        const [mc2Data, setMc2Data] = useState({
            numSamples: 1,
            fib: { enabled: true, type: 'targeted', operator: 'staff' }, 
            tem: { enabled: true, hours: 5, operator: 'user' },
            ebsd: { enabled: false, hours: 4, operator: 'user' },
            nano: { enabled: false, hours: 4, operator: 'user' },
            service: { hours: 0 } 
        });
        const [applySafetyToMc2, setApplySafetyToMc2] = useState(false);

        // --- State: Quote Info ---
        const [quoteInfo, setQuoteInfo] = useState({
        trackingNumber: "",
        piName: "", piEmail: "", piInst: "",
        autoMonitor: true,          // ✅ NEW (default ON)
        monitorHours: 0,            // manual override when autoMonitor = false
        miblStaffHours: 0,
        corrosionHours: 0, supplyCost: 0, supplyUnits: 0
        });

        // --- Refs for file inputs ---
        const cathodeFileRef = useRef(null);
        const ratesFileRef = useRef(null);

const displayTotals = quoteQueue.length > 0 ? queueTotals : currentData.totals;

            const breakdown = {

            return {

        const mc2Factor = applySafetyToMc2 ? safetyFactor : 1.0;

            // --- Force single-page letter fit (scale down if needed) ---
            const PX_PER_IN = 96;

            // Letter page size in px (CSS inches → px)
            const PAGE_W_PX = 8.5 * PX_PER_IN;
            const PAGE_H_PX = 11 * PX_PER_IN;

            // Your jsPDF margin (in inches) below; keep consistent
            const PDF_MARGIN_IN = 0.4;

            // Usable printable area (px)
            const usableW = PAGE_W_PX - 2 * (PDF_MARGIN_IN * PX_PER_IN);
            const usableH = PAGE_H_PX - 2 * (PDF_MARGIN_IN * PX_PER_IN);

            // Ensure clone uses border-box so padding doesn't blow width/height

            const scaleW = usableW / r0.width;
            const scaleH = usableH / r0.height;

                        <input 
                            type="checkbox" 
                            checked={applySafetyToMc2}
                            onChange={(e) => setApplySafetyToMc2(e.target.checked)}
                            className="w-5 h-5 text-indigo-600 rounded focus:ring-indigo-500"
                        />
                    </div>
                </div>

                <div className="bg-indigo-50 p-4 rounded-lg border border-indigo-100 flex flex-col md:flex-row gap-6 items-center mb-8">
                    <div className="flex-grow">
                        <label className="text-sm font-bold text-indigo-900 uppercase tracking-wide block mb-2">Total Number of Samples</label>
                        <div className="flex gap-2">
                            <input 
                                type="number" min="1" 
                                value={mc2Data.numSamples} 
                                onChange={(e) => updateMc2(null, 'numSamples', Math.max(1, parseInt(e.target.value) || 0))}
                                className="border border-indigo-300 rounded p-2 w-32 focus:ring-2 focus:ring-indigo-500 outline-none"
                            />
                            {calculatedTotalSamples > 0 && calculatedTotalSamples !== mc2Data.numSamples && (
                                <button 
                                    onClick={() => updateMc2(null, 'numSamples', calculatedTotalSamples)}
                                    className="text-xs bg-indigo-200 text-indigo-800 px-3 py-2 rounded hover:bg-indigo-300 transition-colors"
                                >
                                    Sync to Calculated Count ({calculatedTotalSamples})
                                </button>
                            )}
                        </div>
                    </div>
                    <div className="flex gap-8 text-indigo-900">
                        <div className="text-center">
                            <span className="block text-xs uppercase font-bold text-indigo-500">Instrument Hrs</span>
                            <span className="block text-2xl font-bold">{mc2Results.instrumentHours.toFixed(1)}</span>
                        </div>
                        <div className="text-center">
                            <span className="block text-xs uppercase font-bold text-indigo-500">Staff Hrs</span>
                            <span className="block text-2xl font-bold">{mc2Results.staffHours.toFixed(1)}</span>
                        </div>
                        <div className="text-center">
                            <span className="block text-xs uppercase font-bold text-indigo-500">Service Hrs</span>
                            <span className="block text-2xl font-bold">{mc2Results.serviceHours.toFixed(1)}</span>
                        </div>
                    </div>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">

                {/* Service Activities */}
                <div className="border border-gray-200 rounded-lg p-4 bg-gray-50">
                    <div className="flex justify-between items-center mb-4">
                    <h3 className="font-bold text-gray-800">Additional Service Activities</h3>
                    </div>
                    <div className="space-y-3">
                    <div className="input-group">
                        <label>Total Service Hours (Flat)</label>
                        <input
                        type="number"
                        value={mc2Data.service ? mc2Data.service.hours : 0}
                        onChange={(e) => updateMc2('service', 'hours', parseFloat(e.target.value) || 0)}
                        />
                    </div>
                    <p className="text-xs text-gray-500 italic">
                        Use for planned staff-only service time (instrument setup, troubleshooting, special workflows).
                    </p>
                    </div>
                </div>

                {/* FIB */}
                <div className="border border-gray-200 rounded-lg p-4 bg-gray-50">
                    <div className="flex justify-between items-center mb-4">
                    <div className="flex items-center gap-2">
                        <input
                        type="checkbox"
                        checked={mc2Data.fib.enabled}
                        onChange={(e) => updateMc2('fib', 'enabled', e.target.checked)}
                        className="w-5 h-5 text-indigo-600 rounded"
                        />
                        <h3 className="font-bold text-gray-800">FIB Sample Prep</h3>
                    </div>
                    </div>

                    {mc2Data.fib.enabled && (
                    <div className="space-y-4 pl-7">
                        <div>
                        <label className="text-xs font-semibold text-gray-500 uppercase mb-1 block">Liftout Type</label>
                        <div className="flex gap-3">
                            <button
                            onClick={() => updateMc2('fib', 'type', 'targeted')}
                            className={`flex-1 py-2 px-3 rounded text-sm border ${mc2Data.fib.type === 'targeted'
                                ? 'bg-indigo-600 text-white border-indigo-600'
                                : 'bg-white text-gray-700 border-gray-300'}`}
                            >
                            Targeted (8h)
                            </button>
                            <button
                            onClick={() => updateMc2('fib', 'type', 'random')}
                            className={`flex-1 py-2 px-3 rounded text-sm border ${mc2Data.fib.type === 'random'
                                ? 'bg-indigo-600 text-white border-indigo-600'
                                : 'bg-white text-gray-700 border-gray-300'}`}
                            >
                            Random (4h)
                            </button>
                        </div>
                        </div>

                        <div className="flex justify-between items-center">
                        <label className="text-sm font-medium text-gray-700">Operator:</label>
                        <Toggle
                            value={mc2Data.fib.operator}
                            onChange={(v) => updateMc2('fib', 'operator', v)}
                            options={[{ val: 'user', label: 'Trained User' }, { val: 'staff', label: 'MC2 Staff' }]}
                        />
                        </div>

                        <p className="text-xs text-gray-500 italic border-t pt-2">
                        Note: Targeted prep typically produces 1–2 lamella.
                        </p>
                    </div>
                    )}
                </div>

                {/* TEM */}
                <div className="border border-gray-200 rounded-lg p-4 bg-gray-50">
                    <div className="flex justify-between items-center mb-4">
                    <div className="flex items-center gap-2">
                        <input
                        type="checkbox"
                        checked={mc2Data.tem.enabled}
                        onChange={(e) => updateMc2('tem', 'enabled', e.target.checked)}
                        className="w-5 h-5 text-indigo-600 rounded"
                        />
                        <h3 className="font-bold text-gray-800">TEM / Microscopy</h3>
                    </div>
                    </div>

                    {mc2Data.tem.enabled && (
                    <div className="space-y-4 pl-7">
                        <div className="input-group">
                        <label>Hours per Sample</label>
                        <input
                            type="number"
                            value={mc2Data.tem.hours}
                            onChange={(e) => updateMc2('tem', 'hours', parseFloat(e.target.value) || 0)}
                        />
                        <p className="text-xs text-gray-500 mt-1">Typical: 4–6 h/sample</p>
                        </div>

                        <div className="flex justify-between items-center">
                        <label className="text-sm font-medium text-gray-700">Operator:</label>
                        <Toggle
                            value={mc2Data.tem.operator}
                            onChange={(v) => updateMc2('tem', 'operator', v)}
                            options={[{ val: 'user', label: 'Trained User' }, { val: 'staff', label: 'MC2 Staff' }]}
                        />
                        </div>
                    </div>
                    )}
                </div>

                {/* EBSD */}
                <div className="border border-gray-200 rounded-lg p-4 bg-gray-50">
                    <div className="flex justify-between items-center mb-4">
                    <div className="flex items-center gap-2">
                        <input
                        type="checkbox"
                        checked={mc2Data.ebsd.enabled}
                        onChange={(e) => updateMc2('ebsd', 'enabled', e.target.checked)}
                        className="w-5 h-5 text-indigo-600 rounded"
                        />
                        <h3 className="font-bold text-gray-800">EBSD</h3>
                    </div>
                    </div>

                    {mc2Data.ebsd.enabled && (
                    <div className="space-y-4 pl-7">
                        <div className="input-group">
                        <label>Hours per Sample</label>
                        <input
                            type="number"
                            value={mc2Data.ebsd.hours}
                            onChange={(e) => updateMc2('ebsd', 'hours', parseFloat(e.target.value) || 0)}
                        />
                        </div>

                        <div className="flex justify-between items-center">
                        <label className="text-sm font-medium text-gray-700">Operator:</label>
                        <Toggle
                            value={mc2Data.ebsd.operator}
                            onChange={(v) => updateMc2('ebsd', 'operator', v)}
                            options={[{ val: 'user', label: 'Trained User' }, { val: 'staff', label: 'MC2 Staff' }]}
                        />
                        </div>
                    </div>
                    )}
                </div>

                {/* Nanoindentation */}
                <div className="border border-gray-200 rounded-lg p-4 bg-gray-50">
                    <div className="flex justify-between items-center mb-4">
                    <div className="flex items-center gap-2">
                        <input
                        type="checkbox"
                        checked={mc2Data.nano.enabled}
                        onChange={(e) => updateMc2('nano', 'enabled', e.target.checked)}
                        className="w-5 h-5 text-indigo-600 rounded"
                        />
                        <h3 className="font-bold text-gray-800">Nanoindentation</h3>
                    </div>
                    </div>

                    {mc2Data.nano.enabled && (
                    <div className="space-y-4 pl-7">
                        <div className="input-group">
                        <label>Hours per Sample</label>
                        <input
                            type="number"
                            value={mc2Data.nano.hours}
                            onChange={(e) => updateMc2('nano', 'hours', parseFloat(e.target.value) || 0)}
                        />
                        </div>

                        <div className="flex justify-between items-center">
                        <label className="text-sm font-medium text-gray-700">Operator:</label>
                        <Toggle
                            value={mc2Data.nano.operator}
                            onChange={(v) => updateMc2('nano', 'operator', v)}
                            options={[{ val: 'user', label: 'Trained User' }, { val: 'staff', label: 'MC2 Staff' }]}
                        />
                        </div>
                    </div>
                    )}
                </div>

                {/* Totals card (nice to have; matches older feel) */}
                <div className="lg:col-span-2 bg-white border border-indigo-200 rounded-lg p-4">
                    <div className="flex justify-between items-center">
                    <div>
                        <h3 className="font-bold text-indigo-900">MC2 Totals</h3>
                        <p className="text-xs text-gray-500">
                        Instrument + Staff (+ Service) {applySafetyToMc2 ? `(safety x${safetyFactor} applied)` : "(no safety factor)"}
                        </p>
                    </div>
                    <div className="text-right">
                        <div className="text-sm text-gray-600">Instrument: <span className="font-bold text-indigo-800">{mc2Results.instrumentHours.toFixed(2)} h</span></div>
                        <div className="text-sm text-gray-600">Staff: <span className="font-bold text-indigo-800">{mc2Results.staffHours.toFixed(2)} h</span></div>
                        <div className="text-sm text-gray-600">Service: <span className="font-bold text-indigo-800">{mc2Results.serviceHours.toFixed(2)} h</span></div>
                        <div className="text-lg font-bold text-indigo-900 mt-1">Total: {mc2Results.total.toFixed(2)} h</div>
                    </div>
                    </div>
                </div>

                </div>

            </div>
        );

        // ... (Keep existing Database UI) ...
        const renderDatabase = () => (
             <div className="card p-6">
                <div className="flex justify-between items-center mb-6">
                    <h2 className="text-xl font-bold">Cathode / Ion Source Database</h2>
                    <button onClick={() => { const newId = Math.max(...cathodes.map(c => c.id)) + 1; setCathodes([...cathodes, { id: newId, name: 'New Ion', type: 'solid', life: 100, defaultRate: 1e-4 }]); }} className="flex items-center gap-2 bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700"><Icon name="plus" size={16} /> Add Ion</button>
                </div>
                <div className="overflow-x-auto">
                    <table className="w-full text-sm">
                        <thead className="bg-gray-50 text-gray-600 uppercase">
                            <tr>
                                <th className="px-4 py-2 text-left">Ion Name</th>
                                <th className="px-4 py-2 text-left">Type</th>
                                <th className="px-4 py-2 text-left">Limit (h)</th>
                                <th className="px-4 py-2 text-left">Default Rate</th>
                                <th className="px-4 py-2 text-right"></th>
                            </tr>
                        </thead>
                        <tbody className="divide-y">
                            {cathodes.map((c, idx) => (
                                <tr key={c.id}>
                                    <td className="px-4 py-2"><input type="text" value={c.name} onChange={(e) => { const n=[...cathodes]; n[idx].name=e.target.value; setCathodes(n); }} className="border rounded px-2 py-1 w-full"/></td>
                                    <td className="px-4 py-2"><select value={c.type} onChange={(e) => { const n=[...cathodes]; n[idx].type=e.target.value; if(e.target.value==='gas')n[idx].life=Infinity; setCathodes(n); }} className="border rounded px-2 py-1 w-full"><option value="gas">Gas</option><option value="solid">Solid</option></select></td>
                                    <td className="px-4 py-2"><input type="number" value={c.life===Infinity?'':c.life} placeholder="∞" disabled={c.type==='gas'} onChange={(e) => { const n=[...cathodes]; n[idx].life=parseFloat(e.target.value)||0; setCathodes(n); }} className="border rounded px-2 py-1 w-full"/></td>
                                    <td className="px-4 py-2"><input type="number" step="1e-5" value={c.defaultRate||1e-4} onChange={(e) => { const n=[...cathodes]; n[idx].defaultRate=parseFloat(e.target.value)||0; setCathodes(n); }} className="border rounded px-2 py-1 w-full"/></td>
                                    <td className="px-4 py-2 text-right"><button onClick={() => setCathodes(cathodes.filter(x => x.id !== c.id))} className="text-red-500"><Icon name="trash" size={18}/></button></td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            </div>
        );

        return (
            <div className="max-w-7xl mx-auto p-4 md:p-8">
                <header className="mb-8 flex flex-col md:flex-row justify-between items-center gap-4 bg-umblue p-4 rounded-lg text-white">
                    <div className="flex items-center gap-4">
                        
                        <div>
                            <h1 className="text-3xl font-bold flex items-center gap-3">
                                MIBL Experiment Calculator
                            </h1>
                            <p className="text-gray-300 mt-1">Hours analysis and quoting tool for Ion Beam Laboratory experiments.</p>
                        </div>
                    </div>
                    
                    <div className="flex items-center gap-3">
                        <div className="flex bg-white rounded-lg p-1 shadow-sm border">
                            <button onClick={() => setActiveTab('calculator')} className={`px-4 py-2 rounded-md font-medium text-sm flex items-center gap-2 transition-colors ${activeTab === 'calculator' ? 'bg-ummaize text-umblue' : 'text-gray-600 hover:bg-gray-50'}`}>
                                <Icon name="settings" size={16} /> Calculator
                            </button>
                            <button onClick={() => setActiveTab('mc2')} className={`px-4 py-2 rounded-md font-medium text-sm flex items-center gap-2 transition-colors ${activeTab === 'mc2' ? 'bg-ummaize text-umblue' : 'text-gray-600 hover:bg-gray-50'}`}>
                                <Icon name="microscope" size={16} /> MC2 Char.
                            </button>
                            <button onClick={() => setActiveTab('quote')} className={`px-4 py-2 rounded-md font-medium text-sm flex items-center gap-2 transition-colors ${activeTab === 'quote' ? 'bg-ummaize text-umblue' : 'text-gray-600 hover:bg-gray-50'}`}>
                                <Icon name="file-text" size={16} /> Quote & Rates
                            </button>
                            <button onClick={() => setActiveTab('database')} className={`px-4 py-2 rounded-md font-medium text-sm flex items-center gap-2 transition-colors ${activeTab === 'database' ? 'bg-ummaize text-umblue' : 'text-gray-600 hover:bg-gray-50'}`}>
                                <Icon name="database" size={16} /> Cathode DB
                            </button>
                        </div>
                    </div>
                </header>

                {activeTab === 'calculator' && renderCalculator()}
                {activeTab === 'mc2' && renderMC2()}
                {activeTab === 'quote' && renderQuote()}
                {activeTab === 'database' && renderDatabase()}

            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

</script>

</body>
</html>
